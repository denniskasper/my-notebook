name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main queue instead, so a deploy is never cut off
  # mid-rollout and every merge that isn't superseded by a newer one reaches production.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: test
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub's official image via the ECR Public mirror (no pull rate limit).
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_notebook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d my_notebook_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Throwaway service container; no real credentials.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/my_notebook_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/my_notebook_test
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: image
    needs: [check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_notebook
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d my_notebook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ env.PUSH }}
      # Load the image into the local daemon for the smoke check (attestations can't be loaded);
      # the attested build below rebuilds it from the same cache.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: my-notebook:smoke
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke check
        env:
          COMMIT: ${{ github.sha }}
        run: |
          # Throwaway service container and secret; no real credentials.
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/my_notebook \
            -e IP_HASH_SECRET=ci-smoke-check-only-not-a-real-secret-0123456789 \
            my-notebook:smoke
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:3000/api/health); then
              echo "$body"
              if [ "$(echo "$body" | jq -r .commit)" = "$COMMIT" ]; then
                exit 0
              fi
              echo "::error::/api/health reports a commit other than $COMMIT"
              break
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - if: always()
        run: docker rm -f smoke || true
      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with SBOM and provenance (pushed on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Environment secrets; the environment only deploys from main.
    environment: production
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Check secrets and mask hosts
        run: |
          missing=0
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_APPLICATION_ID PRODUCTION_URL TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the production environment"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          # GitHub masks whole secret values only; mask the bare hosts too, since curl and
          # tailscale print them on their own in errors.
          for url in "$DOKPLOY_URL" "$PRODUCTION_URL"; do
            host=${url#*://}
            host=${host%%/*}
            echo "::add-mask::$host"
            echo "::add-mask::${host%%:*}"
          done
      - name: Join the tailnet (ephemeral node)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          log-mode: quiet
      - name: Deploy on Dokploy
        run: |
          # Dokploy pulls the `main` tag the image job just pushed and rolls it out on Swarm.
          body=$(jq -n --arg id "$DOKPLOY_APPLICATION_ID" --arg title "CI deploy ${COMMIT:0:7}" \
            '{applicationId: $id, title: $title}')
          # No --retry: a slow answer may still have queued the deploy, and a retry would queue another.
          curl -fsS --max-time 30 -o /dev/null \
            -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'content-type: application/json' \
            -d "$body"
          echo "Deployment of $COMMIT queued"
      - name: Wait for production to report the commit
        run: |
          # Swarm starts the new container next to the old one and only switches once its
          # health check passes; if it doesn't, Swarm rolls back and the old commit stays.
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            seen=''
            if body=$(curl -fsS --max-time 10 "${PRODUCTION_URL%/}/api/health"); then
              # A non-JSON answer (e.g. a proxy page mid-rollout) must not end the poll.
              seen=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
              if [ "$seen" = "$COMMIT" ]; then
                echo "Production reports $COMMIT: $body"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Production did not report $COMMIT within 5 minutes (last seen: ${seen:-no answer}). Swarm has rolled back or the rollout is stuck; see docs/operations/rollback.md."
          exit 1
