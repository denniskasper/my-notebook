name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: test
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub's official image via the ECR Public mirror (no pull rate limit).
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_notebook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d my_notebook_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Throwaway service container; no real credentials.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/my_notebook_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/my_notebook_test
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: image
    needs: [check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_notebook
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d my_notebook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ env.PUSH }}
      # Load a single-platform copy for the smoke check; the attested build below reuses its cache.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: my-notebook:smoke
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke check
        env:
          COMMIT: ${{ github.sha }}
        run: |
          # Throwaway service container and secret; no real credentials.
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/my_notebook \
            -e IP_HASH_SECRET=ci-smoke-check-only-not-a-real-secret-0123456789 \
            my-notebook:smoke
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:3000/api/health); then
              echo "$body"
              test "$(echo "$body" | jq -r .commit)" = "$COMMIT"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - if: always()
        run: docker rm -f smoke || true
      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with SBOM and provenance (pushed on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
