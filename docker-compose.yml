# Local Postgres 18 with the dev database and the `_test` database for integration tests.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_notebook
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d my_notebook']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
